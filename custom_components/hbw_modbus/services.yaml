turn_on_for:
  target:
    entity:
      integration: hbw_modbus
      domain:
        - switch
        - light
  fields:
    seconds:
      required: true
      example: 300
      selector:
        number:
          min: 1
          max: 65535
          unit_of_measurement: s
          mode: box
set_meter_reading:
  target:
    entity:
      integration: hbw_modbus
      domain: sensor
      device_class: energy
  fields:
    value:
      required: true
      example: 12345.678
      selector:
        number:
          min: 0
          max: 4294967
          step: 0.001
          unit_of_measurement: kWh
          mode: box
